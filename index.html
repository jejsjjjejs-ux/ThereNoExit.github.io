<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный поиск</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main>
<form class="s" id="f" autocomplete="off">
<input id="q" type="search" placeholder="Введите запрос" aria-label="Запрос">
<button class="go" id="go" type="submit">Найти</button>
</form>
<div id="out" aria-live="polite"></div>
<div id="gate">
<button type="button" class="ghost" id="gopen">Вход для администратора</button>
<form id="gform" autocomplete="off">
<input type="password" id="gpw" placeholder="Пароль" aria-label="Пароль администратора" autocomplete="off">
<button class="go" id="gbtn" type="submit">Войти</button>
</form>
<div id="gmsg" aria-live="polite"></div>
</div>
<section id="admin">
<h2>Зашифровать файл</h2>
<p>Создаёт зашифрованную запись entry.txt. Её строку нужно добавить в js/data.js (или отдать Claude). Фразу лучше делать длинной.</p>
<div class="f">
<input type="text" id="ph" placeholder="Фраза-запрос для этого файла">
<input type="text" id="pw2" placeholder="Пароль на файл (необязательно)">
<input type="text" id="hint" placeholder="Подсказка к паролю (необязательно)">
<input type="file" id="fl">
<button class="go" id="add" type="button">Зашифровать</button>
</div>
<div id="st"></div>
</section>
</main>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
